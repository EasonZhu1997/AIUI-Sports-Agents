<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">AIUI Sports Agents logo</title>
  <desc id="desc">A smart-glasses outline containing a sensor waveform and three colored nodes for running, cycling, and rowing.</desc>
  <defs>
    <linearGradient id="bg" x1="56" y1="40" x2="456" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0B2038"/>
      <stop offset="1" stop-color="#10182E"/>
    </linearGradient>
    <linearGradient id="visor" x1="92" y1="188" x2="420" y2="328" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54D6FF"/>
      <stop offset="0.52" stop-color="#5EE6A8"/>
      <stop offset="1" stop-color="#FFB34D"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
