<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">AIUI Craft 从项目导入到真机复测流程</title>
  <desc id="desc">依次打开或导入项目，进入 AIUI Code，使用 Interactive Inview 预览，打包或上传，选择眼镜，最后真机复测。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#141827"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.34"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#a371f7"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#f0f6fc}.title{font-size:38px;font-weight:760}.muted{fill:#8b949e}.small{font-size:17px}.cardTitle{font-size:21px;font-weight:730}.num{font-size:20px;font-weight:760}.tag{font-size:16px;font-weight:700}</style>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <g transform="translate(48 16) scale(0.92)">
  <circle cx="1110" cy="90" r="170" fill="#8957e5" opacity="0.08"/>
  <circle cx="62" cy="61" r="27" fill="#8957e5"/><text x="62" y="69" text-anchor="middle" class="num">05</text>
  <text x="104" y="73" class="title">进入 AIUI Craft：从源码到真机复测</text>
  <text x="104" y="105" class="muted small">每一步都保留版本、截图和结果；预览成功不能替代真机验证</text>

  <rect x="58" y="140" width="1084" height="78" rx="16" fill="#161b22" stroke="#30363d"/>
  <circle cx="88" cy="168" r="6" fill="#ff7b72"/><circle cx="108" cy="168" r="6" fill="#e3b341"/><circle cx="128" cy="168" r="6" fill="#3fb950"/>
  <text x="160" y="177" font-size="22" font-weight="720">Craft 工作区</text>
  <rect x="894" y="157" width="216" height="42" rx="8" fill="#2c1f48" stroke="#a371f7"/><text x="1002" y="184" text-anchor="middle" font-size="17" font-weight="700">Package / Upload</text>

  <path d="M220 342 H250 M414 342 H444 M608 342 H638 M802 342 H832 M996 342 H1026" stroke="#a371f7" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="52" y="262" width="168" height="178" rx="16" fill="#161b22" stroke="#58a6ff"/><circle cx="82" cy="294" r="20" fill="#1f6feb"/><text x="82" y="301" text-anchor="middle" class="num">1</text><text x="112" y="301" class="cardTitle">打开项目</text><rect x="72" y="324" width="128" height="46" rx="8" fill="#21262d" stroke="#58a6ff"/><text x="136" y="344" text-anchor="middle" class="tag">Open / Import</text><text x="136" y="363" text-anchor="middle" class="tag">Project</text><text x="76" y="405" class="small">选择源码目录</text><text x="76" y="429" class="small">确认入口文件</text></g>
  <g filter="url(#shadow)"><rect x="246" y="262" width="168" height="178" rx="16" fill="#161b22" stroke="#a371f7"/><circle cx="276" cy="294" r="20" fill="#8957e5"/><text x="276" y="301" text-anchor="middle" class="num">2</text><text x="306" y="301" class="cardTitle">编辑代码</text><rect x="266" y="324" width="128" height="46" rx="8" fill="#2c1f48"/><text x="330" y="353" text-anchor="middle" class="tag">AIUI Code</text><text x="270" y="405" class="small">检查配置和资源</text><text x="270" y="429" class="small">完成静态校验</text></g>
  <g filter="url(#shadow)"><rect x="440" y="262" width="168" height="178" rx="16" fill="#161b22" stroke="#d29922"/><circle cx="470" cy="294" r="20" fill="#9e6a03"/><text x="470" y="301" text-anchor="middle" class="num">3</text><text x="500" y="301" class="cardTitle">交互预览</text><rect x="460" y="320" width="128" height="54" rx="8" fill="#3b2e12"/><text x="524" y="343" text-anchor="middle" class="tag">Interactive</text><text x="524" y="363" text-anchor="middle" class="tag">Inview</text><text x="464" y="405" class="small">走通主要页面</text><text x="464" y="429" class="small">记录预览结果</text></g>
  <g filter="url(#shadow)"><rect x="634" y="262" width="168" height="178" rx="16" fill="#161b22" stroke="#a371f7"/><circle cx="664" cy="294" r="20" fill="#8957e5"/><text x="664" y="301" text-anchor="middle" class="num">4</text><text x="694" y="301" class="cardTitle">生成包</text><rect x="654" y="324" width="128" height="46" rx="8" fill="#2c1f48"/><text x="718" y="344" text-anchor="middle" class="tag">Package /</text><text x="718" y="363" text-anchor="middle" class="tag">Upload</text><text x="658" y="405" class="small">核对版本与 UUID</text><text x="658" y="429" class="small">保留构建结果</text></g>
  <g filter="url(#shadow)"><rect x="828" y="262" width="168" height="178" rx="16" fill="#161b22" stroke="#58a6ff"/><circle cx="858" cy="294" r="20" fill="#1f6feb"/><text x="858" y="301" text-anchor="middle" class="num">5</text><text x="888" y="301" class="cardTitle">选择眼镜</text><rect x="848" y="324" width="128" height="46" rx="8" fill="#102b45"/><text x="912" y="353" text-anchor="middle" class="tag">选择目标设备</text><text x="852" y="405" class="small">仅选自己的设备</text><text x="852" y="429" class="small">不公开设备标识</text></g>
  <g filter="url(#shadow)"><rect x="1022" y="262" width="126" height="178" rx="16" fill="#163822" stroke="#3fb950" stroke-width="2"/><circle cx="1052" cy="294" r="20" fill="#238636"/><text x="1052" y="301" text-anchor="middle" class="num">6</text><text x="1082" y="301" class="cardTitle">复测</text><text x="1046" y="344" class="tag">真机运行</text><text x="1046" y="378" class="small">交互</text><text x="1046" y="405" class="small">传感器</text><text x="1046" y="432" class="small">稳定性</text></g>

  <rect x="114" y="493" width="972" height="88" rx="18" fill="#201d2e" stroke="#a371f7" stroke-width="2"/>
  <text x="150" y="527" font-size="21" font-weight="730" fill="#d2a8ff">界面提示</text>
  <text x="150" y="558" class="small">按钮名称和位置可能随 Craft 版本、账号权限或项目类型不同；以当前页面为准，找不到时先查项目文档。</text>
  <rect x="330" y="615" width="540" height="44" rx="22" fill="#162436" stroke="#58a6ff"/>
  <text x="600" y="643" text-anchor="middle" font-size="19" font-weight="700">源码可读 → 预览可用 → 包可生成 → 真机可验证</text>
  </g>
</svg>
