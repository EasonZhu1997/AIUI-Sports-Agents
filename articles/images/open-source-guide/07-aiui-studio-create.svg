<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">AIUI Studio 创建智能体操作示意</title>
  <desc id="desc">在 AIUI Studio space 左栏点击创建，填写创建智能体弹窗中的智能体名称、版本号、类别、功能介绍、开场白、图标、权限依赖和预览素材，可选上传程序包后确认。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#151827"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.36"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#a371f7"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#f0f6fc}.title{font-size:37px;font-weight:760}.muted{fill:#8b949e}.small{font-size:16px}.label{font-size:17px;font-weight:700}.num{font-size:20px;font-weight:760}.field{font-size:15px;fill:#8b949e}</style>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <g transform="translate(48 16) scale(0.92)">
  <circle cx="1100" cy="70" r="170" fill="#8957e5" opacity="0.08"/>
  <circle cx="62" cy="61" r="27" fill="#8957e5"/><text x="62" y="69" text-anchor="middle" class="num">07</text>
  <text x="104" y="72" class="title">AIUI Studio：新建智能体，可选上传程序包</text>
  <text x="104" y="105" class="muted small">界面参考版本 1.0.18；实际字段、类别和按钮位置可能随账号或版本变化</text>

  <g filter="url(#shadow)">
    <rect x="50" y="137" width="1100" height="500" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <rect x="50" y="137" width="226" height="500" rx="18" fill="#161b22"/>
    <rect x="258" y="137" width="18" height="500" fill="#161b22"/>
  </g>
  <text x="78" y="179" font-size="21" font-weight="730">AIUI Studio space</text>
  <line x1="76" y1="199" x2="246" y2="199" stroke="#30363d"/>
  <rect x="74" y="220" width="176" height="52" rx="10" fill="#8957e5" stroke="#a371f7" stroke-width="2"/>
  <circle cx="103" cy="246" r="16" fill="#6e40c9"/><path d="M96 246 H110 M103 239 V253" stroke="#ffffff" stroke-width="3"/>
  <text x="137" y="253" class="label">创建</text>
  <circle cx="64" cy="246" r="20" fill="#1f6feb"/><text x="64" y="253" text-anchor="middle" class="num">1</text>
  <text x="83" y="322" class="muted small">项目</text><text x="83" y="360" class="muted small">灵珠</text><text x="83" y="398" class="muted small">文档</text>
  <path d="M252 246 C310 246 302 200 358 200" fill="none" stroke="#a371f7" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="335" y="165" width="770" height="434" rx="18" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <rect x="335" y="165" width="770" height="58" rx="18" fill="#21262d"/>
    <rect x="335" y="205" width="770" height="18" fill="#21262d"/>
  </g>
  <circle cx="370" cy="194" r="20" fill="#8957e5"/><text x="370" y="201" text-anchor="middle" class="num">2</text>
  <text x="404" y="202" font-size="23" font-weight="740">创建智能体</text>
  <text x="1072" y="201" text-anchor="middle" font-size="24" fill="#8b949e">×</text>

  <g>
    <text x="370" y="256" class="label">智能体名称</text><rect x="370" y="267" width="216" height="42" rx="7" fill="#0d1117" stroke="#30363d"/><text x="386" y="293" class="field">填写可识别的名称</text>
    <text x="610" y="256" class="label">版本号</text><rect x="610" y="267" width="150" height="42" rx="7" fill="#0d1117" stroke="#30363d"/><text x="626" y="293" class="field">例如 1.0.0</text>
    <text x="784" y="256" class="label">类别</text><rect x="784" y="267" width="282" height="42" rx="7" fill="#0d1117" stroke="#30363d"/><text x="800" y="293" class="field">从当前下拉选项选择</text><path d="M1042 284 l8 8 8 -8" fill="none" stroke="#8b949e" stroke-width="2"/>
    <text x="370" y="341" class="label">功能介绍</text><rect x="370" y="352" width="340" height="60" rx="7" fill="#0d1117" stroke="#30363d"/><text x="386" y="378" class="field">说明解决什么问题、如何使用</text>
    <text x="734" y="341" class="label">开场白</text><rect x="734" y="352" width="332" height="60" rx="7" fill="#0d1117" stroke="#30363d"/><text x="750" y="378" class="field">首次打开时给用户的提示</text>
    <text x="370" y="444" class="label">图标</text><rect x="370" y="455" width="94" height="62" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="5 4"/><text x="417" y="492" text-anchor="middle" class="field">上传</text>
    <text x="486" y="444" class="label">权限依赖</text><rect x="486" y="455" width="178" height="62" rx="8" fill="#0d1117" stroke="#30363d"/><text x="502" y="482" class="field">按实际能力勾选</text><text x="502" y="504" class="field">遵循最小权限</text>
    <text x="686" y="444" class="label">预览图 / 视频</text><rect x="686" y="455" width="170" height="62" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="5 4"/><text x="771" y="492" text-anchor="middle" class="field">上传展示素材</text>
    <text x="878" y="444" class="label">agent 程序包（可选）</text><rect x="878" y="455" width="188" height="62" rx="8" fill="#0d1117" stroke="#a371f7"/><rect x="954" y="470" width="96" height="34" rx="6" fill="#2c1f48" stroke="#a371f7"/><text x="1002" y="492" text-anchor="middle" class="small" fill="#d2a8ff">选择文件</text><text x="892" y="480" class="field">包</text>
  </g>
  <circle cx="890" cy="559" r="20" fill="#238636"/><text x="890" y="566" text-anchor="middle" class="num">3</text>
  <rect x="926" y="539" width="140" height="42" rx="8" fill="#238636"/><text x="996" y="566" text-anchor="middle" class="label">确认</text>
  <rect x="310" y="650" width="580" height="34" rx="17" fill="#2b1d21" stroke="#f85149"/>
  <text x="600" y="673" text-anchor="middle" class="small" fill="#ffa198">类别为平台动态配置项：以创建当日页面为准，不要照抄旧截图</text>
  </g>
</svg>
